baseURL = "https://remysedlak.com/"
languageCode = "en-us"
title = "Remy Sedlak"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10


[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  hardWraps = true
  unsafe = true

[params]
  env = "production"
  title = "Remy Sedlak"
  description = "[Developer portfolio of Remy Sedlak]"
  keywords = ["Remy Sedlak", "Sedlak"]
  author = "Remy Sedlak"

  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = "Remy Sedlak"
    Content = "Senior, Computer Science, University of Pittsburgh \n\n Hi, I am Remy, a student, problem solver, and designer. I am currently finishing up school at Pitt where I focus on human-computer interaction and machine learning."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rsedlak"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/remysedlak"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:remysedlak@gmail.com"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1

  # [[menu.main]]
  #   identifier = "about"
  #   name = "About"
  #   url = "/about/"
  #   weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20

  [[menu.main]]
    identifier = "experience"
    name = "Experience"
    url = "/experience/"
    weight = 30
